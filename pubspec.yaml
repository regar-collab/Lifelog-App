name: lifelog
description: "A new Flutter project."
publish_to: 'none'
# versionCode 必须大于已安装的版本。旧的 arm64 分架构包是 2001
# （Flutter 会给分架构包加 1000*ABI 偏移），所以这里直接从 2002 起，
# 避免普通 debug/universal 包因版本号更低而被系统卸载重装。
version: 0.2.0+2003

environment:
  sdk: ^3.13.5

dependencies:
  collection: ^1.19.1
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  image_picker: ^1.2.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  permission_handler: 12.0.0
  riverpod_annotation: ^4.0.7
  receive_sharing_intent: ^1.9.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pedometer: ^4.2.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
